site_name: A11yPocket
site_description: Guia de boas práticas para acessibilidade digital
site_author: Grupo 11

theme:
  name: material
  language: pt-BR
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true