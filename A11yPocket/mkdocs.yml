site_name: A11yPocket G11
site_description: Guia prático com checklists interativos e boas práticas de acessibilidade em interfaces web.
site_url: https://unb-ihc.github.io/IHC_2026.2_Grupo11/
copyright: © 2026 Grupo 11 — Interação Humano-Computador, UnB

theme:
  name: material
  language: pt-BR
  logo: assets/images/logo.svg
  favicon: assets/images/logo.svg
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Ativar modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Ativar modo claro

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true

plugins:
  - search:
      lang: pt

extra_css:
  - css/extra.css
  - css/guia.css
  - css/relatorio.css
  - css/avaliacao.css
  - css/navegacao.css

extra_javascript:
  - js/guia-checklist.js

nav:
  - Início: index.md
  - Documentação:
      - Visão geral: documentacao/index.md
      - Fundamentos de acessibilidade:
          - Guia UK-Brasil: documentacao/guia-uk-brasil.md
          - Norma ABNT NBR 17225: documentacao/nbr-17225.md
          - Alinhamento NBR × Guia: documentacao/alinhamento.md
          - WCAG 2.2: documentacao/wcag.md
      - Ferramentas de teste:
        - Visão geral: documentacao/ferramentas/index.md
        - Ferramentas de análise de acessibilidade:
          - WAVE: documentacao/ferramentas/wave.md
          - Lighthouse (Google): documentacao/ferramentas/lighthouse.md
          - Axe DevTools (Deque Systems): documentacao/ferramentas/axe.md
          - ASES Web (Gov.br): documentacao/ferramentas/ases.md
        - Leitores de tela:
          - NVDA: documentacao/ferramentas/nvda.md
          - VoiceOver (iOS): documentacao/ferramentas/voiceover.md
          - TalkBack (Android): documentacao/ferramentas/talkback.md
      - Métodos de IHC:
        - Visão geral: documentacao/ux-dcu/index.md
        - Técnicas de UX/DCU:
          - Personas: documentacao/ux-dcu/personas.md
          - Jornadas do usuário (User Journeys): documentacao/ux-dcu/jornadas.md
          - Blueprint de serviços (Service Blueprint): documentacao/ux-dcu/blueprint.md
          - Canvas (UX Canvas / Lean UX Canvas): documentacao/ux-dcu/canvas.md
          - Design empático: documentacao/ux-dcu/design-empatico.md
      - Avaliações:
          - Avaliação do site:
            - Resumo: documentacao/avaliacao-site/index.md
            - Escopo: documentacao/avaliacao-site/escopo.md
            - Metodologia: documentacao/avaliacao-site/metodologia.md
            - Avaliação automática: documentacao/avaliacao-site/avaliacao-automatica.md
            - Avaliação manual: documentacao/avaliacao-site/avaliacao-manual.md
            - Heurísticas de Nielsen: documentacao/avaliacao-site/heuristicas.md
            - Tabela de problemas: documentacao/avaliacao-site/problemas.md
            - Teste com usuário: documentacao/avaliacao-site/teste-usuario.md
            - Recomendações e conclusão: documentacao/avaliacao-site/recomendacoes.md
            - Apêndice B – Prints das ferramentas: documentacao/avaliacao-site/evidencias-ferramentas.md
            - Apêndice C – Evidências dos problemas: documentacao/avaliacao-site/evidencias-manuais.md
            - Referências do relatório: documentacao/avaliacao-site/referencias.md
          - Avaliação com usuário:
            - Visão geral: documentacao/avaliacao-usuario/index.md
            - Metodologia: documentacao/avaliacao-usuario/metodologia.md
            - Métricas e Score SUS: documentacao/avaliacao-usuario/resultados.md
            - Análise e achados: documentacao/avaliacao-usuario/analise.md
            - Recomendações e conclusão: documentacao/avaliacao-usuario/recomendacoes.md
            - "Anexo A — Roteiro do teste": documentacao/avaliacao-usuario/anexo-a.md
            - "Anexo B — Termo de consentimento": documentacao/avaliacao-usuario/anexo-b.md
      - Referências: referencias.md
  - Checklist:
      - Introdução: checklist/index.md
      - Visão geral do progresso: checklist/progresso.md
      - Eixos do guia:
          - Gestão de Projetos: checklist/gestao-projetos.md
          - Desenvolvimento e testes: checklist/desenvolvimento.md
          - Design: checklist/design.md
          - Conteúdo: checklist/conteudo.md
      - Complemento:
          - Heurísticas: checklist/heuristicas.md
  - GitHub ↗: https://github.com/UnB-IHC/IHC_2026.2_Grupo11