site_name: A11yPocket G11
site_description: Guia prático com checklists interativos e boas práticas de acessibilidade em interfaces web.
site_url: https://unb-ihc.github.io/IHC_2026.2_Grupo11/
copyright: © 2026 Grupo 11 — Interação Humano-Computador, UnB

theme:
  name: material
  language: pt-BR
  logo: assets/images/logo.svg
  favicon: assets/images/logo.svg
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.path
    - navigation.top
    - toc.follow
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: blue
      toggle:
        icon: material/weather-night
        name: Ativar modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Ativar modo claro

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true
  - toc:
      toc_depth: 0
    

plugins:
  - search:
      lang: pt

extra_css:
  - css/extra.css
  - css/guia.css
  - css/relatorio.css
  - css/avaliacao.css
  - css/navegacao.css
  - css/problemas-interativos.css

extra_javascript:
  - js/guia-checklist.js
  - js/problemas-interativos.js

nav:
  - Início: index.md

  - Documentação:
      - Visão geral: documentacao/index.md
      - Normas e diretrizes:
          - WCAG 2.2: documentacao/wcag.md
          - ABNT NBR 17225: documentacao/nbr-17225.md
          - Guia UK-Brasil: documentacao/guia-uk-brasil.md
          - Alinhamento: documentacao/alinhamento.md
      - Ferramentas de avaliação:
          - Visão geral: documentacao/ferramentas/index.md
          - WAVE: documentacao/ferramentas/wave.md
          - axe DevTools: documentacao/ferramentas/axe.md
          - Lighthouse: documentacao/ferramentas/lighthouse.md
          - ASES: documentacao/ferramentas/ases.md
          - NVDA: documentacao/ferramentas/nvda.md
          - VoiceOver: documentacao/ferramentas/voiceover.md
          - TalkBack: documentacao/ferramentas/talkback.md
      - Métodos de IHC:
          - Visão geral: documentacao/ux-dcu/index.md
          - Personas: documentacao/ux-dcu/personas.md
          - Jornadas: documentacao/ux-dcu/jornadas.md
          - Blueprint: documentacao/ux-dcu/blueprint.md
          - UX Canvas: documentacao/ux-dcu/canvas.md
          - Design empático: documentacao/ux-dcu/design-empatico.md
      - Avaliação do site:
          - Visão geral: documentacao/avaliacao-site/index.md
          - Escopo: documentacao/avaliacao-site/escopo.md
          - Metodologia: documentacao/avaliacao-site/metodologia.md
          - Avaliação automática: documentacao/avaliacao-site/avaliacao-automatica.md
          - Avaliação manual: documentacao/avaliacao-site/avaliacao-manual.md
          - Heurísticas: documentacao/avaliacao-site/heuristicas.md
          - Problemas encontrados: documentacao/avaliacao-site/problemas.md
          - Teste com usuário: documentacao/avaliacao-site/teste-usuario.md
          - Recomendações: documentacao/avaliacao-site/recomendacoes.md
      - Avaliação com usuário:
          - Visão geral: documentacao/avaliacao-usuario/index.md
          - Metodologia: documentacao/avaliacao-usuario/metodologia.md
          - Resultados: documentacao/avaliacao-usuario/resultados.md
          - Análise: documentacao/avaliacao-usuario/analise.md
          - Recomendações: documentacao/avaliacao-usuario/recomendacoes.md
      - Referências: referencias.md
      
  - Checklist de boas práticas:
      - Visão geral: checklist/index.md
      - Quatro eixos de acessibilidade:
        - Gestão de Projetos: checklist/gestao-projetos.md
        - Desenvolvimento: checklist/desenvolvimento.md
        - Design: checklist/design.md
        - Conteúdo: checklist/conteudo.md
      - Complemento:
        - Heurísticas: checklist/heuristicas.md

  - GitHub ↗: https://github.com/UnB-IHC/IHC_2026.2_Grupo11