site_name: A11yPocket G11
site_description: Guia prático com checklists interativos e boas práticas de acessibilidade em interfaces web.
site_url: https://unb-ihc.github.io/IHC_2026.2_Grupo11/
copyright: © 2026 Grupo 11 — Interação Humano-Computador, UnB

theme:
  name: material
  language: pt-BR
  logo: assets/images/logo.svg
  favicon: assets/images/logo.svg
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.path
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Ativar modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Ativar modo claro

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true

plugins:
  - search:
      lang: pt

extra_css:
  - css/extra.css
  - css/guia.css

extra_javascript:
  - js/guia-checklist.js

nav:
  - Início: index.md
  - Documentação:
      - Visão geral: documentacao/index.md
      - Fundamentos de acessibilidade:
          - Guia UK-Brasil: documentacao/guia-uk-brasil.md
          - Norma ABNT NBR 17225: documentacao/nbr-17225.md
          - Alinhamento NBR × Guia: documentacao/alinhamento.md
          - WCAG 2.2: documentacao/wcag.md
      - Métodos de IHC:
          - Técnicas de UX/DCU: documentacao/ux-dcu.md
      - Avaliações:
          - Avaliação do site: documentacao/avaliacao-site.md
          - Avaliação com usuário: documentacao/avaliacao-usuario.md
      - Referências: referencias.md
  - Checklist e ferramentas:
      - Introdução: checklist/index.md
      - Visão geral do progresso: checklist/progresso.md
      - Eixos do guia:
          - Gestão de Projetos: checklist/gestao-projetos.md
          - Desenvolvimento e testes: checklist/desenvolvimento.md
          - Design: checklist/design.md
          - Conteúdo: checklist/conteudo.md
          - Heurísticas: checklist/heuristicas.md
          - Ferramentas de teste: ferramentas.md
  - GitHub ↗: https://github.com/UnB-IHC/IHC_2026.2_Grupo11